name: links
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers every automated checker with status 999, so it can't be checked from CI.
          args: --no-progress --root-dir dist --exclude 'linkedin\.com' 'dist/**/*.html'
          fail: true
